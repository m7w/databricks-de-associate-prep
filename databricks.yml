# yaml-language-server: $schema=./.dab-schema.json

bundle:
  name: de_associate_preparation
include:
  - resources/variables.yml
  - resources/infrastructure.yml
  - resources/pipelines/customer_events.pipeline.yml
  - resources/jobs/customer_events.job.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-a02cab6b-25f9.cloud.databricks.com
    variables:
      catalog: prep_dev
      schema: default
      kafka_topic: dev_raw_events

  prod:
    mode: production
    workspace:
      host: https://dbc-a02cab6b-25f9.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prep_prod
      schema: default
      kafka_topic: prod_raw_events
    run_as:
      service_principal_name: ${var.service_principal_id}
    permissions:
      - user_name: mkovaliou@gmail.com
        level: CAN_MANAGE
      - service_principal_name: ${var.service_principal_id}
        level: CAN_MANAGE
