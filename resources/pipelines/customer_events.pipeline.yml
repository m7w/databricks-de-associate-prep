# yaml-language-server: $schema=../../.dab-schema.json

resources:
  pipelines:
    customer_events_pipeline:
      name: customer_events_pipeline
      catalog: ${var.catalog}
      schema: ${var.schema}
      libraries:
        - file:
            path: ../../src/pipelines/*.sql
        - file:
            path: ../../src/pipelines/*.py
      configuration:
        catalog_name: ${var.catalog}
        schema_name: ${resources.schemas.default_schema.name}
        secret_scope: ${var.secret_scope_name}
        kafka_bootstrap_servers: ${var.kafka_bootstrap_servers}
        kafka_topic: ${var.kafka_topic}
        kafka_ca_location: dbfs:${resources.volumes.source_files_volume.volume_path}/kafka_certs/ca.pem
        customers_source_path: ${resources.external_locations.r2_bucket.url}
      continuous: false
      photon: true
      serverless: true
