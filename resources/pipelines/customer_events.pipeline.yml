# yaml-language-server: $schema=../../.dab-schema.json

resources:
  pipelines:
    customer_events_pipeline:
      name: customer_events_pipeline
      catalog: ${var.catalog}
      schema: ${var.schema}
      libraries:
        - file:
            path: ../../src/pipelines/*.sql
      configuration:
        catalog_name: ${var.catalog}
        schema_name: ${var.schema}
      continuous: false
      development: false
      photon: true
      serverless: true
