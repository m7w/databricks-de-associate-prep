# yaml-language-server: $schema=../../.dab-schema.json

resources:
  jobs:
    customer_events_job:
      name: customer_events_job
      tasks:
        - task_key: run_customer_events_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.customer_events_pipeline.id}
      webhook_notifications:
        on_success:
          - id: ${var.notification_webhook_id}
        on_failure:
          - id: ${var.notification_webhook_id}
