# yaml-language-server: $schema=../.dab-schema.json

resources:
  schemas:
    default_schema:
      name: ${var.schema}
      catalog_name: ${var.catalog}
      grants:
        - principal: data_engineers
          privileges:
            - ALL_PRIVILEGES
        - principal: account users
          privileges:
            - USE_SCHEMA
            - SELECT

  volumes:
    source_files_volume:
      name: files
      catalog_name: ${var.catalog}
      schema_name: ${var.schema}
      volume_type: MANAGED

  secret_scopes:
    kafka_scope:
      name: ${var.secret_scope_name}
      permissions:
        - user_name: mkovaliou@gmail.com
          level: MANAGE
        - service_principal_name: e8248218-6794-4138-8883-3085867140d3
          level: READ

  external_locations:
    r2_bucket:
      name: r2_bucket_${bundle.target}
      url: r2://${var.r2_bucket}@${var.cf_account_id}.r2.cloudflarestorage.com/${bundle.target}/customers
      credential_name: r2_bucket_cred
      grants:
        - principal: data_engineers
          privileges:
            - READ_FILES
            - MANAGE
        - principal: account users
          privileges:
            - READ_FILES
