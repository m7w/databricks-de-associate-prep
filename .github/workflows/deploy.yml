name: Databricks Bundle CI/CD
on:
  push:
    branches:
      - develop
      - master
    paths-ignore:
      - "README.md"
      - "docs/**"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:

env:
  DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
  DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
  BUNDLE_VAR_notification_webhook_id: ${{ secrets.NOTIFICATION_WEBHOOK_ID }}

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'
    name: Deploy and Test Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Bundle Config
        run: |
          databricks bundle validate

      - name: Deploy Bundle
        run: |
          databricks bundle deploy -t dev --auto-approve

      - name: Create Directories in Volume and Upload Test Data and Cerificates
        run: |
          VOLUME_PATH=$(databricks bundle validate -t dev --output json | jq -r '.resources.volumes.source_files_volume.volume_path')

          databricks fs mkdir dbfs:${VOLUME_PATH}/customers
          databricks fs cp ./test_data/customers dbfs:${VOLUME_PATH}/customers --recursive
          databricks fs mkdir dbfs:${VOLUME_PATH}/kafka_certs
          databricks fs cp ./kafka_certs dbfs:${VOLUME_PATH}/kafka_certs --recursive

      - name: Sync Secrets to Databricks
        run: |
          databricks secrets put-secret kafka_scope kafka_user \
            --string-value "${{ secrets.KAFKA_USER }}"
          databricks secrets put-secret kafka_scope kafka_password \
            --string-value "${{ secrets.KAFKA_PASSWORD }}"

      - name: Run Pipeline Integration Test
        run: |
          databricks bundle run customer_events_job -t dev

  deploy-prod:
    if: github.ref == 'refs/heads/master'
    name: Deploy and Test Bundle
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Bundle Config
        run: |
          databricks bundle validate

      - name: Deploy Bundle
        run: |
          databricks bundle deploy -t prod --auto-approve

      - name: Create Directories in Volume and Upload Cerificates
        run: |
          VOLUME_PATH=$(databricks bundle validate -t dev --output json | jq -r '.resources.volumes.source_files_volume.volume_path')

          databricks fs mkdir dbfs:${VOLUME_PATH}/kafka_certs
          databricks fs cp ./kafka_certs dbfs:${VOLUME_PATH}/kafka_certs --recursive

      - name: Sync Secrets to Databricks
        run: |
          databricks secrets put-secret kafka_scope kafka_user \
            --string-value "${{ secrets.KAFKA_USER }}"
          databricks secrets put-secret kafka_scope kafka_password \
            --string-value "${{ secrets.KAFKA_PASSWORD }}"
